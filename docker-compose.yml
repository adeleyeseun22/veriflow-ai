name: ${COMPOSE_PROJECT_NAME:-veriflow}

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg18
    container_name: veriflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veriflow}
      POSTGRES_USER: ${POSTGRES_USER:-veriflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veriflow_dev_password}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-veriflow} -d ${POSTGRES_DB:-veriflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - veriflow-network

  redis:
    image: redis:8.2.7-alpine
    container_name: veriflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - veriflow-network

  minio:
    image: minio/minio:latest
    container_name: veriflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veriflow_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veriflow_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - veriflow-network

  api:
    image: veriflow-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: veriflow-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-VeriFlow AI API}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_VERSION: ${API_VERSION:-0.5.0}
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-veriflow}:${POSTGRES_PASSWORD:-veriflow_dev_password}@postgres:5432/${POSTGRES_DB:-veriflow}
      REDIS_URL: redis://redis:6379/0
      BACKEND_CORS_ORIGINS: >-
        ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-veriflow_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-veriflow_csrf}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-veriflow_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-veriflow_minio_password}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-veriflow-documents}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-26214400}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks:
      - veriflow-network

  web:
    image: veriflow-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: veriflow-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-veriflow_csrf}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - veriflow-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  veriflow-network:
    driver: bridge
