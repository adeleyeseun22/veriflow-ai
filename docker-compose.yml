name: ${COMPOSE_PROJECT_NAME:-veriflow}

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg18
    container_name: veriflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veriflow}
      POSTGRES_USER: ${POSTGRES_USER:-veriflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veriflow_dev_password}

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18 requires the volume at /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-veriflow} -d ${POSTGRES_DB:-veriflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - veriflow-network

  redis:
    image: redis:8.2.7-alpine
    container_name: veriflow-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

    networks:
      - veriflow-network

  api:
    image: veriflow-api:latest

    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: veriflow-api
    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME:-VeriFlow AI API}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_VERSION: ${API_VERSION:-0.1.0}

      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-veriflow}:${POSTGRES_PASSWORD:-veriflow_dev_password}@postgres:5432/${POSTGRES_DB:-veriflow}

      REDIS_URL: redis://redis:6379/0

      BACKEND_CORS_ORIGINS: >-
        ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - veriflow-network

  web:
    image: veriflow-web:latest

    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}

    container_name: veriflow-web
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - veriflow-network

volumes:
  postgres_data:
  redis_data:

networks:
  veriflow-network:
    driver: bridge