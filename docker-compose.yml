name: ${COMPOSE_PROJECT_NAME:-veriflow}

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg18
    container_name: veriflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veriflow}
      POSTGRES_USER: ${POSTGRES_USER:-veriflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veriflow_dev_password}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veriflow} -d ${POSTGRES_DB:-veriflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [veriflow-network]

  redis:
    image: redis:8.2.7-alpine
    container_name: veriflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [veriflow-network]

  minio:
    image: minio/minio:latest
    container_name: veriflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veriflow_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veriflow_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [veriflow-network]

  worker:
    image: veriflow-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: veriflow-worker
    restart: unless-stopped
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - veriflow_api.worker:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --hostname=document-worker@%h
    environment: &api-environment
      APP_NAME: ${APP_NAME:-VeriFlow AI API}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_VERSION: ${API_VERSION:-0.9.0}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veriflow}:${POSTGRES_PASSWORD:-veriflow_dev_password}@postgres:5432/${POSTGRES_DB:-veriflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-document-processing}
      PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-3}
      PROCESSING_RETRY_BASE_SECONDS: ${PROCESSING_RETRY_BASE_SECONDS:-5}
      WORKER_HEARTBEAT_KEY: ${WORKER_HEARTBEAT_KEY:-veriflow:workers:document-processing}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-90}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-veriflow_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-veriflow_minio_password}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-veriflow-documents}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-26214400}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-veriflow_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-veriflow_csrf}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-2}
      EMBEDDING_CACHE_DIR: /models/fastembed
      SEMANTIC_SEARCH_DEFAULT_LIMIT: ${SEMANTIC_SEARCH_DEFAULT_LIMIT:-10}
      SEMANTIC_SEARCH_MAX_LIMIT: ${SEMANTIC_SEARCH_MAX_LIMIT:-50}
    volumes:
      - embedding_cache:/models/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "from veriflow_api.worker_health import worker_is_healthy_sync; raise SystemExit(0 if worker_is_healthy_sync() else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks: [veriflow-network]

  api:
    image: veriflow-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: veriflow-api
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - embedding_cache:/models/fastembed
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks: [veriflow-network]

  web:
    image: veriflow-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: veriflow-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-veriflow_csrf}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [veriflow-network]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  embedding_cache:

networks:
  veriflow-network:
    driver: bridge
